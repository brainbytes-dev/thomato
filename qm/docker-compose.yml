services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: qm
      POSTGRES_PASSWORD: qm
      POSTGRES_DB: qm_dev
    ports:
      - "5437:5432"
    volumes:
      - qm-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  qm-pgdata:
